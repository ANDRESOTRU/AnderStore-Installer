name: "Build AnderStore Installer (Windows)"

# Сборка только по запросу: Actions → Build AnderStore Installer (Windows) → Run workflow
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add MSVC to PATH
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Perl and Make
        run: choco install strawberryperl make --no-progress

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun i --frozen-lockfile

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = "2.3.${{ github.run_number }}"
          $config = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          $ciConfig = Get-Content -Raw src-tauri/ci.conf.json | ConvertFrom-Json
          $ciConfig | Add-Member -NotePropertyName version -NotePropertyValue $version -Force
          $ciConfig | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 src-tauri/ci.conf.json
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "AnderStore Installer version $version (base version $($config.version))"

      - name: Build and publish signed updater
        id: tauri_build
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: AnderStore Installer v${{ steps.version.outputs.version }}
          releaseBody: AnderStore Installer for Windows.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis --config src-tauri/ci.conf.json

      - name: Collect installer
        id: collect_installer
        if: always()
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe out/AnderStore-Installer-Setup.exe
          ls -la out

      - name: Upload artifact
        if: steps.collect_installer.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: AnderStore-Installer-Setup
          path: out/AnderStore-Installer-Setup.exe

      - name: Publish installer release
        if: steps.collect_installer.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --title "AnderStore Installer $tag" `
              --target "${{ github.sha }}" `
              --notes "AnderStore Installer for Windows."
          }
          gh release upload $tag out/AnderStore-Installer-Setup.exe

      - name: Report updater signing fallback
        if: steps.tauri_build.outcome == 'failure' && steps.collect_installer.outcome == 'success'
        shell: pwsh
        run: Write-Output "::warning::The EXE was published, but the signed updater artifacts require a valid TAURI_SIGNING_PRIVATE_KEY secret."
