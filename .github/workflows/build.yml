name: "Build AnderStore Installer (Windows)"

# Сборка только по запросу: Actions → Build AnderStore Installer (Windows) → Run workflow
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add MSVC to PATH
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Perl and Make
        run: choco install strawberryperl make --no-progress

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun i --frozen-lockfile

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $config = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          "version=$($config.version)" >> $env:GITHUB_OUTPUT

      - name: Build and publish signed updater
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: AnderStore Installer v${{ steps.version.outputs.version }}
          releaseBody: AnderStore Installer for Windows.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis --config src-tauri/ci.conf.json

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe out/AnderStore-Installer-Setup.exe
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AnderStore-Installer-Setup
          path: out/AnderStore-Installer-Setup.exe
