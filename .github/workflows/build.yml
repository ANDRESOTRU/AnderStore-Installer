name: "Build AnderStore Installer (Windows)"

on:
  workflow_dispatch:

concurrency:
  group: installer-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Perl and Make
        run: choco install strawberryperl make --no-progress
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frontend dependencies
        run: bun i --frozen-lockfile
      - name: Verify versions and signing configuration
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required. Restore the existing signing key; do not replace the public key used by installed clients."
          }
          node scripts/check-version.mjs
          if ($LASTEXITCODE -ne 0) { throw "Version check failed" }
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $existing = gh release view $tag --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0 -and -not $existing.isDraft) {
            throw "Version $version is already published. Bump all project versions before releasing."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Test frontend behavior
        run: bun run test
      - name: Build signed updater into draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: AnderStore Installer v${{ steps.version.outputs.version }}
          releaseBody: "Понятные инструкции Apple ID и встроенное обновление установщика. Для перехода с 2.3.6 и более старых версий один раз установите новый EXE вручную: с 2.3.7 используется собственный ключ подписи AnderStore."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --config src-tauri/ci.conf.json
      - name: Verify uploaded update before publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release download $tag --dir out
          if ($LASTEXITCODE -ne 0) { throw "Could not download draft release artifacts" }
          node scripts/validate-updater.mjs out "${{ steps.version.outputs.version }}" "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "Updater validation failed; release remains a draft" }
          $manifest = Get-Content -Raw out/latest.json | ConvertFrom-Json
          $installerName = [System.Uri]::UnescapeDataString(([System.Uri]$manifest.platforms.'windows-x86_64'.url).Segments[-1])
          Copy-Item -LiteralPath (Join-Path out $installerName) -Destination out/AnderStore-Installer-Setup.exe
          gh release upload $tag out/AnderStore-Installer-Setup.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload download-page installer" }
      - name: Upload verified installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: AnderStore-Installer-Setup
          path: out/AnderStore-Installer-Setup.exe
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ steps.version.outputs.version }}" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish verified release" }
